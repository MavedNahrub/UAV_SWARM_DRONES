# scenario_failure_injection.yaml — UAV failure mid-mission
#
# uav_01 fails at t=90s (well into mission, after POIs assigned).
# fleet_manager must promote uav_05 (RESERVE) and CBBA must re-bid
# uav_01's uncompleted PoIs. Far PoIs guarantee relay is needed.

mission:
  name: "failure_injection"
  duration_s: 600
  seed: 101

uavs:
  count: 6
  roles:
    uav_00: SURVEYOR
    uav_01: SURVEYOR   # ← fails at t=90s
    uav_02: SURVEYOR
    uav_03: SURVEYOR
    uav_04: RELAY
    uav_05: RESERVE    # ← promoted to SURVEYOR after failure

gcs:
  position:
    x: 0.0
    y: 0.0
    z: 0.0

geofence:
  polygon:
    - {x: -500.0, y: -500.0, z: 0.0}
    - {x:  500.0, y: -500.0, z: 0.0}
    - {x:  500.0,  y: 500.0, z: 0.0}
    - {x: -500.0,  y: 500.0, z: 0.0}
  max_altitude_m: 120.0

obstacles:
  - center: {x: 120.0, y: 80.0,  z: 0.0}
    radius_m: 22.0   # collapsed apartment

  - center: {x: -90.0, y: 140.0, z: 0.0}
    radius_m: 20.0   # office ruin

  - center: {x: 200.0, y: -60.0, z: 0.0}
    radius_m: 18.0   # debris field A

  - center: {x: -160.0, y: -80.0, z: 0.0}
    radius_m: 28.0   # landslide

  - center: {x: 50.0, y: -30.0,  z: 20.0}
    radius_m: 6.0    # comms tower

  - center: {x: 310.0, y: 120.0, z: 0.0}
    radius_m: 25.0   # factory ruin (added — relevant for poi_farE)

pois:
  # NEAR
  - poi_id: "poi_01"
    position: {x: 80.0, y: 120.0, z: 0.0}
    priority: 2
    survey_duration_s: 25.0

  # MID
  - poi_id: "poi_02"
    position: {x: 200.0, y: -50.0, z: 0.0}
    priority: 2   # URGENT — uav_01 likely assigned here; fails en route
    survey_duration_s: 30.0

  - poi_id: "poi_03"
    position: {x: -100.0, y: 200.0, z: 0.0}
    priority: 1
    survey_duration_s: 20.0

  # FAR — require relay, reserved uav_05 must complete after promotion
  - poi_id: "poi_04"
    position: {x: 150.0, y: 300.0, z: 0.0}
    priority: 1
    survey_duration_s: 35.0

fault_injection:
  - time_s: 90.0
    target_uav: "uav_01"
    fault_type: "UAV_FAILURE"

priority_interrupts: []
