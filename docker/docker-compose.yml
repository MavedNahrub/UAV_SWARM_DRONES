###############################################################################
# docker-compose.yml — PX4 Multi-UAV SITL Development Environment
###############################################################################
services:
  px4-sitl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: px4_swarm_dev
    privileged: true
    stdin_open: true
    tty: true

    # ── NVIDIA GPU passthrough ──
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # ── X11 forwarding for Gazebo GUI ──
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=graphics,utility,compute
      - XAUTHORITY=/tmp/.Xauthority

    volumes:
      # X11 socket for GUI
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/tmp/.Xauthority:ro
      # Mount workspace for live script editing
      - ../:/home/px4user/uav_swarm:rw

    # ── Network: host mode for easy MAVLink + DDS access ──
    network_mode: host

    # ── IPC: needed for shared memory (Fast DDS) ──
    ipc: host
